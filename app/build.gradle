plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvbrowser.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tvbrowser.tv'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.0.1'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
